android.enableJetifier=true
android.useAndroidX=true
org.gradle.daemon=true
# Default daemon heap (512m) is not enough for D8/R8 dex merging at compileSdk 36 --
# :app:mergeExtDex* died with java.lang.OutOfMemoryError: Java heap space.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
