import org.gradle.api.attributes.Attribute
import org.gradle.api.attributes.AttributeCompatibilityRule
import org.gradle.api.attributes.CompatibilityCheckDetails

// AGP tags Android resolvable classpaths with kotlin platform.type=androidJvm so they can
// consume Kotlin-Multiplatform artifacts. The rule that makes a producer 'jvm' variant
// acceptable to an 'androidJvm' consumer normally ships with the Kotlin Gradle plugin,
// which this (deliberately pure-Java) project does not apply. Without it, KMP artifacts
// that publish only jvm/native variants -- androidx.annotation >= 1.8.0 and its transitive
// kotlin-stdlib -- fail to resolve ("No matching variant"). Register the rule manually.
abstract class KotlinPlatformTypeCompat implements AttributeCompatibilityRule<String> {
    @Override
    void execute(CompatibilityCheckDetails<String> details) {
        if (details.consumerValue == 'androidJvm' && details.producerValue == 'jvm') {
            details.compatible()
        }
    }
}

dependencies {
    attributesSchema {
        attribute(Attribute.of('org.jetbrains.kotlin.platform.type', String)) {
            compatibilityRules.add(KotlinPlatformTypeCompat)
        }
    }
}

android {
    namespace 'net.openid.appauth'
    compileSdkVersion rootProject.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.compileSdkVersion
        versionCode rootProject.versionNum
        versionName rootProject.versionName
    }
    sourceSets {
        main.manifest.srcFile 'AndroidManifest.xml'
        main.java.srcDirs = ['java']
        main.aidl.srcDirs = ['java']
        main.res.srcDir 'res'
        main.assets.srcDir 'assets'
        main.resources.srcDir 'java'
        test.setRoot('javatests')
        test.java.srcDir('javatests')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        warningsAsErrors true
        disable 'InvalidPackage', 'TrulyRandom', 'UseCompoundDrawables', 'GradleDependency'
    }
    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }
}

// produces just the classes JAR
task jar(type: Copy, dependsOn:'bundleRelease') {
    from("${project.buildDir}/intermediates/bundles/release/")
    into("${project.buildDir}/libs/")
    include('classes.jar')
    rename('classes.jar', "appauth-${rootProject.versionName}.jar")
}

// produces a JAR containing sources
task sourcesJar(type: Jar, dependsOn:'generateReleaseSources') {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier = 'sources'
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}
